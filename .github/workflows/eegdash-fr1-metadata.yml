name: eegdash-fr1-metadata

on:
  push:
    branches:
      - main
    paths:
      - 'experiments/eegdash_fr1_metadata_probe.py'
      - '.github/workflows/eegdash-fr1-metadata.yml'
  workflow_dispatch:

jobs:
  metadata-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install eegdash
      - name: Query DS004789 metadata without downloading signal
        run: python experiments/eegdash_fr1_metadata_probe.py
