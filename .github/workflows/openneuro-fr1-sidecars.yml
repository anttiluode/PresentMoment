name: openneuro-fr1-sidecars

on:
  push:
    branches:
      - main
    paths:
      - 'experiments/openneuro_fr1_sidecar_probe.py'
      - '.github/workflows/openneuro-fr1-sidecars.yml'
  workflow_dispatch:

jobs:
  sidecar-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: List DS004789 and inspect tiny BIDS sidecars only
        run: python experiments/openneuro_fr1_sidecar_probe.py
