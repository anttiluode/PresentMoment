name: ye-task-phase-reproduction

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ye_task_phase_reproduction.py'
      - '.github/workflows/ye-task-phase-reproduction.yml'
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy h5py remotezip
      - name: Reproduce public phase split and fixed lag sweep
        run: python experiments/ye_task_phase_reproduction.py
      - name: Show saved result
        run: cat results/ye_task_phase_reproduction.json
      - uses: actions/upload-artifact@v4
        with:
          name: ye-task-phase-reproduction
          path: results/ye_task_phase_reproduction.json
