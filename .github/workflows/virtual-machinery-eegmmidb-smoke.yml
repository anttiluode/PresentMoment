name: virtual-machinery-eegmmidb-smoke

on:
  push:
    paths:
      - ".github/workflows/virtual-machinery-eegmmidb-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "mne>=1.8" "scikit-learn>=1.5" awscli

      - name: Prefetch three subjects from PhysioNet public S3 mirror
        run: |
          set -euo pipefail
          ROOT=.cache/eegmmidb/MNE-eegbci-data/files/eegmmidb/1.0.0
          for subject in 001 002 003; do
            mkdir -p "$ROOT/S${subject}"
            for run in 03 04 07 08 11 12; do
              file="S${subject}R${run}.edf"
              aws s3 cp --only-show-errors --no-sign-request \
                "s3://physionet-open/eegmmidb/1.0.0/S${subject}/${file}" \
                "$ROOT/S${subject}/${file}"
            done
          done
          du -sh "$ROOT"

      - name: Run three-subject smoke test
        run: |
          python experiments/eegmmidb_virtual_machinery.py \
            --subjects 1-3 \
            --cache-dir .cache/eegmmidb \
            --out-csv artifacts/eegmmidb_virtual_machinery_smoke.csv \
            --out-json artifacts/eegmmidb_virtual_machinery_smoke.json
      - name: Show result
        if: always()
        run: |
          if [ -f artifacts/eegmmidb_virtual_machinery_smoke.json ]; then
            cat artifacts/eegmmidb_virtual_machinery_smoke.json
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eegmmidb-virtual-machinery-smoke
          path: artifacts/
          if-no-files-found: warn
