name: inspect-gigascience-raw-s01

on:
  push:
    paths:
      - ".github/workflows/inspect-gigascience-raw-s01.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install range readers
        run: python -m pip install remotezip requests scipy
      - name: List MATLAB variables and decode small metadata
        run: |
          python - <<'PY'
          import io
          import struct
          import zlib
          import requests
          from remotezip import RemoteZip
          from scipy.io import loadmat

          URL = 'https://zenodo.org/records/20348444/files/v1_raw_S01.zip?download=1'
          MI_MATRIX = 14
          MI_COMPRESSED = 15

          def get_range(start, n):
              r = requests.get(URL, headers={'Range': f'bytes={start}-{start+n-1}'}, timeout=60)
              r.raise_for_status()
              if r.status_code != 206:
                  raise RuntimeError(f'Range not honored: HTTP {r.status_code}')
              return r.content

          def pad8(n): return (n + 7) & ~7

          def subelement(buf, off):
              w1, w2 = struct.unpack_from('<II', buf, off)
              small_n = w1 >> 16
              if small_n:
                  raw = struct.pack('<I', w2)[:small_n]
                  return w1 & 0xFFFF, small_n, raw, off + 8
              typ, n = w1, w2
              start = off + 8
              return typ, n, buf[start:start+n], start + pad8(n)

          def matrix_name_dims(prefix):
              typ, _ = struct.unpack_from('<II', prefix, 0)
              off = 8 if typ == MI_MATRIX else 0
              _, _, _, off = subelement(prefix, off)
              _, _, dims_raw, off = subelement(prefix, off)
              dims = struct.unpack('<' + 'i' * (len(dims_raw)//4), dims_raw)
              _, _, name_raw, off = subelement(prefix, off)
              return name_raw.decode('utf-8', 'replace'), dims

          def member_data_start(info):
              local = get_range(info.header_offset, 30)
              sig, = struct.unpack_from('<I', local, 0)
              if sig != 0x04034B50: raise RuntimeError('bad ZIP local header')
              fn, ex = struct.unpack_from('<HH', local, 26)
              return info.header_offset + 30 + fn + ex

          def read_member(info, rel, n):
              if info.compress_type != 0: raise RuntimeError('ZIP member not stored')
              return get_range(member_data_start(info) + rel, n)

          def list_mat(info):
              hdr = read_member(info, 0, 128)
              print('HEADER', hdr[:116].decode('ascii', 'replace').rstrip('\x00'))
              pos = 128
              while pos + 8 <= info.file_size:
                  tag = read_member(info, pos, 8)
                  typ, n = struct.unpack('<II', tag)
                  if typ == MI_MATRIX:
                      prefix = tag + read_member(info, pos + 8, min(n, 4096))
                      name, dims = matrix_name_dims(prefix)
                      print(f'VAR pos={pos} bytes={n} name={name!r} dims={dims}')
                      if n <= 1024 * 1024:
                          block = read_member(info, pos, 8 + pad8(n))
                          d = loadmat(io.BytesIO(hdr + block), squeeze_me=False, chars_as_strings=True)
                          value = d.get(name)
                          print(f'VALUE {name} dtype={getattr(value, "dtype", None)} shape={getattr(value, "shape", None)}')
                          print(repr(value))
                  elif typ == MI_COMPRESSED:
                      decomp = zlib.decompressobj()
                      out = bytearray()
                      rel, left = pos + 8, n
                      while left and len(out) < 4096:
                          take = min(65536, left)
                          out.extend(decomp.decompress(read_member(info, rel, take), 4096-len(out)))
                          rel += take; left -= take
                      name, dims = matrix_name_dims(bytes(out))
                      print(f'VAR compressed pos={pos} bytes={n} name={name!r} dims={dims}')
                  else:
                      print(f'TOP pos={pos} type={typ} bytes={n}')
                  pos += 8 + pad8(n)

          with RemoteZip(URL) as z:
              infos = z.infolist()
          for info in infos:
              print(f'\nZIP {info.filename} size={info.file_size}')
              list_mat(info)
          PY
