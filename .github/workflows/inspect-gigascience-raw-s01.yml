name: inspect-gigascience-raw-s01

on:
  push:
    paths:
      - ".github/workflows/inspect-gigascience-raw-s01.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install remote MATLAB header readers
        run: python -m pip install remotezip scipy
      - name: Inspect S01 MATLAB variable headers using HTTP ranges
        run: |
          python - <<'PY'
          from remotezip import RemoteZip
          from scipy.io import whosmat

          url = "https://zenodo.org/records/20348444/files/v1_raw_S01.zip?download=1"
          with RemoteZip(url) as z:
              infos = z.infolist()
              for i in infos:
                  print(f"ZIP {i.file_size:12d} {i.filename}")
              for info in infos:
                  print(f"\nMAT {info.filename}")
                  with z.open(info.filename) as f:
                      print("header=", f.read(116).decode("ascii", "replace").rstrip("\x00"))
                      f.seek(0)
                      for name, shape, cls in whosmat(f):
                          print(f"VAR name={name!r} shape={shape} class={cls}")
          PY
