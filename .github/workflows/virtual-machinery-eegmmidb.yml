name: virtual-machinery-eegmmidb

on:
  push:
    paths:
      - "experiments/eegmmidb_virtual_machinery.py"
      - ".github/workflows/virtual-machinery-eegmmidb.yml"
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26" "mne>=1.8" "scikit-learn>=1.5"

      - name: Run execution-to-imagery transfer test
        run: |
          python experiments/eegmmidb_virtual_machinery.py \
            --subjects 1-12 \
            --cache-dir .cache/eegmmidb \
            --out-csv artifacts/eegmmidb_virtual_machinery.csv \
            --out-json artifacts/eegmmidb_virtual_machinery.json

      - name: Show aggregate result
        if: always()
        run: |
          if [ -f artifacts/eegmmidb_virtual_machinery.json ]; then
            cat artifacts/eegmmidb_virtual_machinery.json
          fi

      - name: Upload result tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eegmmidb-virtual-machinery
          path: artifacts/
          if-no-files-found: warn
