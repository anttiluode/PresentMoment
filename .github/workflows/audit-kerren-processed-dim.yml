name: audit-kerren-processed-dimensionality

on:
  push:
    branches: [main]
    paths:
      - 'experiments/audit_kerren_processed_dimensionality.py'
      - '.github/workflows/audit-kerren-processed-dim.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy
      - run: mkdir -p data results
      - name: Download published processed dimensionality MAT
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --progress-bar \
            'https://raw.githubusercontent.com/kerrencasper/Hippocampal-ripples-initiate-cortical-dimensionality-expansion-for-memory-retrieval/main/perf_dimensionality.mat' \
            -o data/perf_dimensionality.mat
      - name: Audit remembered/unsuccessful dimensionality against trial-count imbalance
        shell: bash
        run: |
          set -o pipefail
          python experiments/audit_kerren_processed_dimensionality.py data/perf_dimensionality.mat \
            --out results/kerren-trial-count-audit.json | tee results/kerren-trial-count-audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kerren-trial-count-audit
          path: |
            results/kerren-trial-count-audit.json
            results/kerren-trial-count-audit.txt
