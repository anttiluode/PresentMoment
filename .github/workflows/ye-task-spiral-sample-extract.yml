name: ye-task-spiral-sample-extract

on:
  push:
    branches: [main]
    paths:
      - 'experiments/ye_task_spiral_sample_extract.py'
      - '.github/workflows/ye-task-spiral-sample-extract.yml'
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install remotezip
      - run: python experiments/ye_task_spiral_sample_extract.py
      - run: find results/ye_task_spiral_sample -type f -printf '%p %k KiB\n'
      - uses: actions/upload-artifact@v4
        with:
          name: ye-task-spiral-sample
          path: results/ye_task_spiral_sample
