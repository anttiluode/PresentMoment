name: repod-betti-time-audit

on:
  push:
    branches: [main]
    paths:
      - 'experiments/repod_betti_time_audit.py'
      - '.github/workflows/repod-betti-time-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install numpy scipy mne pyedflib ripser
      - run: mkdir -p data results
      - name: Audit temporal topology and delay units
        shell: bash
        run: |
          set -o pipefail
          python experiments/repod_betti_time_audit.py \
            --data data/repod_schizophrenia \
            --surrogates 4 \
            --out results/repod-betti-time-audit.json \
            | tee results/repod-betti-time-audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repod-betti-time-audit
          path: |
            results/repod-betti-time-audit.json
            results/repod-betti-time-audit.txt
