name: inspect-sitstand-processed

on:
  push:
    paths:
      - ".github/workflows/inspect-sitstand-processed.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install readers
        run: python -m pip install remotezip "mne>=1.8" requests
      - name: Inspect processed MI S01
        run: |
          python - <<'PY'
          from pathlib import Path
          from remotezip import RemoteZip
          import mne

          url = "https://zenodo.org/records/20348464/files/v2_processed_all.zip?download=1"
          out = Path('/tmp/sitstand')
          out.mkdir(parents=True, exist_ok=True)

          wanted = 'filtered_downsampled_fif/MI/S01.fif'
          with RemoteZip(url) as z:
              by_name = {i.filename: i for i in z.infolist()}
              if wanted not in by_name:
                  raise RuntimeError(f'Missing {wanted}; sample={list(by_name)[:10]}')
              info = by_name[wanted]
              target = out / 'MI_S01.fif'
              print('EXTRACT', info.filename, 'bytes', info.file_size)
              with z.open(info) as src, target.open('wb') as dst:
                  while True:
                      chunk = src.read(2 * 1024 * 1024)
                      if not chunk:
                          break
                      dst.write(chunk)

          ep = mne.read_epochs(target, preload=False, verbose='ERROR')
          print('TYPE Epochs')
          print('INFO sfreq', ep.info['sfreq'], 'nchan', len(ep.ch_names), 'len', len(ep))
          print('EVENT_ID', ep.event_id)
          print('CH_NAMES', ep.ch_names)
          print('TMIN_TMAX', ep.tmin, ep.tmax)
          print('EVENT_COUNTS')
          for name, code in ep.event_id.items():
              print(name, int((ep.events[:,2] == code).sum()))
          PY
